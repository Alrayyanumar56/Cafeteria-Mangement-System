<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Billing - CafePOS</title><link href="../vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../css/pos.css" rel="stylesheet"></head><body>
<div id="nav"></div>
<div class="pos-wrap"><div class="bill-grid">
  <div class="panel" id="cats"></div>
  <div class="panel"><div class="tiles" id="tiles"></div><div id="noitems" class="text-muted p-3" hidden>No items here yet. Add some on the Menu page.</div></div>
  <div class="panel d-flex flex-column">
    <div id="cart" class="flex-grow-1" style="min-height:120px"></div>
    <button class="btn btn-outline-primary btn-sm mb-1" id="otherBtn">+ Item not on the menu</button>
    <div id="otherBox" class="border rounded p-2 mb-2" hidden>
      <input id="oName" class="form-control mb-1" maxlength="60" placeholder="Item name">
      <div class="d-flex gap-2 mb-1"><input id="oPrice" type="number" min="1" class="form-control" placeholder="Price"><input id="oQty" type="number" min="1" max="99" value="1" class="form-control" style="max-width:90px"></div>
      <label class="d-block mb-1"><input type="checkbox" id="oKitchen"> Send to the kitchen screen</label>
      <button class="btn btn-primary btn-sm" id="oAdd">Add to order</button>
    </div>
    <div class="total" id="total">Rs 0</div>
    <input id="cname" class="form-control my-2" placeholder="Customer name (optional)" maxlength="40">
    <div class="paymode mb-2"><button data-m="cash" class="on">💵 Cash</button><button data-m="online">📱 Online</button><button data-m="split">➗ Split</button></div>
    <div id="payfields"></div>
    <div id="msg" class="text-danger fw-semibold my-1"></div>
    <button class="pay-btn" id="pay" disabled>Done · Take Payment</button>
    <button class="btn btn-outline-secondary mt-2" id="clear">Clear order</button>
  </div>
</div></div>
<div class="overlay" id="done"><div class="box"><div>Order number</div><div class="bigtoken" id="tok"></div>
  <div id="doneinfo" class="fs-4 my-3"></div><button class="pay-btn" id="next">Next customer</button></div></div>
<script src="../js/common.js"></script><script src="../js/billing.js"></script></body></html>
