<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Menu - CafePOS</title><link href="../vendor/bootstrap/bootstrap.min.css" rel="stylesheet"><link href="../css/pos.css" rel="stylesheet"><script src="../js/guard.js"></script></head><body>
<div id="nav"></div>
<div class="pos-wrap"><div class="row g-3">
  <div class="col-lg-4"><div class="panel">
    <h4>Categories</h4>
    <div id="catlist" class="mb-2"></div>
    <div class="input-group mb-1"><input id="catname" class="form-control" placeholder="New category name"><button id="catsave" class="btn btn-primary">Add</button></div>
    <div class="form-check"><input type="checkbox" id="catkitchen" class="form-check-input"><label for="catkitchen" class="form-check-label">Items go to kitchen screen by default</label></div>
    <div id="catmsg" class="text-danger"></div>
    <hr>
    <h4 id="itemtitle">Add item</h4>
    <input id="iname" class="form-control mb-2" placeholder="Item name">
    <select id="icat" class="form-select mb-2"></select>
    <div class="input-group mb-2"><span class="input-group-text">Rs</span><input id="iprice" type="number" min="0" class="form-control" placeholder="Price"></div>
    <input id="iunit" class="form-control mb-2" placeholder="Unit (plate, glass...) optional">
    <div class="form-check mb-2"><input type="checkbox" id="ikitchen" class="form-check-input"><label for="ikitchen" class="form-check-label">Send to kitchen screen (cooked or plated by staff)</label></div>
    <label class="form-label">Picture</label><input id="ifile" type="file" accept="image/*" class="form-control mb-2">
    <img id="iprev" style="max-height:90px;display:none" class="mb-2 rounded">
    <div id="imsg" class="text-danger"></div>
    <button id="isave" class="btn btn-success w-100">Save item</button>
    <button id="icancel" class="btn btn-link w-100" hidden>Cancel editing</button>
  </div></div>
  <div class="col-lg-8"><div class="panel"><h4>Menu items</h4><div id="items" class="tiles"></div></div></div>
</div></div>
<script src="../js/common.js"></script><script src="../js/addMenu.js"></script></body></html>
